services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-this-secret}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
    volumes:
      - ./backend/app/data:/app/app/data
    networks:
      - edupath

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - edupath

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - edupath

volumes:
  caddy_data:
  caddy_config:

networks:
  edupath:
